# Codemagic — the only machine that ever compiles this app (App Store PRD §1.2, §4.4 C7).
#
# The owner develops on Windows and owns no Mac. Everything under `ios/` is authored blind here and
# first executed on a rented macOS instance, so this file is also where the Windows-authored tree gets
# its first real verification. Expect the loop "push → CI build → read log", not local iteration.
#
# BEFORE THE FIRST RUN — three things the owner does in the Codemagic UI, not here:
#   1. Connect this repository.
#   2. **Settings → Integrations → App Store Connect** → add the `.p8` from C6. NAME IT EXACTLY
#      `bornelaering-asc` or change `integrations.app_store_connect` below to match. The key never
#      goes in this file or anywhere in the repo (`.gitignore` refuses `*.p8` outright).
#      Codemagic's own docs say "Team settings", which is the path only once a TEAM exists. This
#      account is a **Personal Account** and does not have that menu — the same setting lives under
#      plain `Settings`. Do NOT create a team to make the documented path appear: the free macOS
#      minutes are attached to the personal account, and a team can put you on a different plan.
#   3. Nothing else. The signing certificate and the provisioning profile are CREATED BY that API key
#      on the first build — `app-store-connect fetch-signing-files … --create`, see the signing step
#      below. That is what removes the "certificates need a Mac" problem (§2.3): no CSR, no Keychain,
#      no Mac, and nothing for the owner to create by hand in the Apple portal.
#      Do NOT add an `environment.ios_signing:` block to "help" — that is the DECLARATIVE path, it
#      only matches PRE-EXISTING files, and it is what made the first build fail.

# TWO WORKFLOWS, ONE SIGNING HISTORY (staging PRD W7). Everything above applies to both; the comments
# in `ios-release` below are the design record for signing and must not be trimmed when editing either.
#
# The workflows differ in exactly THREE variables — BUNDLE_ID, BL_TIER, BL_API_ORIGIN — and
# `src/config/buildTiers.test.ts` fails if a third workflow appears or if either triple stops matching
# `scripts/set-build-tier.mjs`'s table. `BUNDLE_ID` stays a `vars:` entry rather than a group variable
# so that guard can keep matching it with an `m`-anchored regex: unanchored, it once accepted
# `com.vraa.earlylearning2`, and a SUFFIXED staging id makes that failure mode live again.
#
# TRIGGERS: `ios-staging` builds on a `tf-*` tag, so an everyday build is one command from Windows
# (`git tag tf-46 && git push origin tf-46`). NOT on every push to master — that burns Mac minutes and
# floods TestFlight processing for commits nobody intends to install. `ios-release` has no trigger at
# all: a production build stays a deliberate act, started from the Codemagic UI.

workflows:
  ios-staging:
    name: Børnelæring — staging → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'tf-*'

    integrations:
      app_store_connect: bornelaering-asc

    environment:
      groups:
        - signing
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # The SUFFIXED sibling. A different app to iOS: its own App ID, profile, App Store Connect
        # record, TestFlight track, icon — and, the reason it is worth all of that, its own CONTAINER.
        # A staging build cannot see, migrate or corrupt the child's real progress, because the two
        # apps share no storage. Registered as XU38T75JUS with Sign In with Apple enabled.
        BUNDLE_ID: com.vraa.earlylearning.staging
        BL_TIER: staging
        BL_API_ORIGIN: https://staging.boernelaering.dk
      node: 22
      xcode: latest

    cache:
      cache_paths:
        - $HOME/.npm

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Guard — the tests that can only fail here
        script: npm test

      - name: Point the native project at this tier
        # Rewrites EVERY PRODUCT_BUNDLE_IDENTIFIER in the pbxproj plus capacitor.config.ts's appId and
        # appName, so `cap sync` and the Info.plist display name follow. Mutates this CHECKOUT only —
        # nothing is ever pushed from CI.
        script: node scripts/set-build-tier.mjs "$BL_TIER"

      - name: Build the web bundle
        # BL_TIER / BL_API_ORIGIN are read by vite.config.ts's `define`, which is what bakes the backend
        # into the binary. They are environment variables HERE, at build time, and nowhere else — the
        # shipped app has no environment to read.
        script: npm run build

      - name: Verify the ARTIFACT is a staging build
        # Reads dist/, not the source. This is the guard for "local green proves nothing about the
        # deployed artifact", and it also carries the prebaked-narration count.
        script: node scripts/verify-build-tier.mjs "$BL_TIER"

      - name: Sync the web build into the iOS project
        script: npx cap sync ios

      - name: Set the build number
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Create the signing certificate and profile, then apply them
        # `--create` is what makes the STAGING profile appear on its first run without a Mac, exactly as
        # it did for production. See the long note in ios-release below for why each flag is here.
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build the IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - allanvraa@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # NO `submit_to_testflight` HERE, and its absence is the point.
        #
        # The build still UPLOADS to App Store Connect and internal testers still get it — that is the
        # publishing block above, not this flag. What this flag adds is submission to EXTERNAL beta
        # review, which for a staging app is both pointless and slightly bad: nobody outside this
        # household will ever install `BL Test`, and it would put a deliberately-broken test build in
        # front of an Apple reviewer.
        #
        # It also FAILED the first real staging build in post-processing: external review requires Beta
        # App Information (feedback email) and Beta App Review Information (name, phone, email) on the
        # app record, which a never-submitted app has no reason to carry. The IPA had already uploaded
        # and installed by then, so the red build was reporting a step that should not have run.
        #
        # If external staging testers are ever wanted, add the flag back and fill that form once at
        # https://appstoreconnect.apple.com/apps/6799489044/testflight/test-info

  ios-release:
    name: Børnelæring — production → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Must match the name given to the App Store Connect key in Codemagic's UI (see note 2 above).
      app_store_connect: bornelaering-asc

    environment:
      # NO `ios_signing:` BLOCK — deliberately, and its absence cost a build to learn. `ios_signing` is
      # Codemagic's DECLARATIVE signing path: it fetches a certificate and profile that ALREADY EXIST
      # and matches them by bundle id. Nothing had ever created them — the Apple Developer portal held
      # only the registered App ID (§4.4 C4) — so the match found nothing and the build died on
      # "No matching profiles found for bundle identifier … and distribution type app_store".
      # Codemagic's docs also name MIXING the two paths as a cause of that same error, so the explicit
      # CLI sequence in the signing step REPLACES this block rather than supplementing it.
      # Codemagic requires every UI-defined variable to live in a GROUP, and a group is invisible to
      # the build unless it is named here. `CERTIFICATE_PRIVATE_KEY` (secret, set in the Codemagic UI,
      # never in this repo) is in `signing`. Omit this and the variable simply is not there — the
      # signing step then fails exactly as if the key had never been added, with no hint that a group
      # reference is missing.
      groups:
        - signing
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        # Capacitor names the target and scheme "App" — not the app's name.
        XCODE_SCHEME: App
        # Registered in the Apple Developer portal with Sign in with Apple and no other capabilities.
        # Permanent — it matches `capacitor.config.ts`'s appId and the pbxproj's
        # PRODUCT_BUNDLE_IDENTIFIER, and all three have to stay in step (guarded).
        BUNDLE_ID: com.vraa.earlylearning
        BL_TIER: production
        BL_API_ORIGIN: https://boernelaering.dk
      # The repo's own floor; the local toolchain is Node 22.
      node: 22
      # Apple requires uploads to be BUILT WITH THE iOS 26 SDK (since 2026-04-28), which means an
      # Xcode 26.x. `latest` is deliberate rather than a pin: a pinned older Xcode would start
      # REJECTING at upload the day Apple moves the floor again, and the failure would arrive as an
      # App Store Connect error rather than a build one. The deployment target is pinned instead
      # (17.0, in the pbxproj) — that is the number that decides whether the child's iPad can run it,
      # and SDK and deployment target are independent.
      xcode: latest

    cache:
      cache_paths:
        - $HOME/.npm

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Guard — the tests that can only fail here
        # `capacitorConfig.test.ts` pins the deployment target, the privacy manifest, the Danish
        # purpose string, the POSIX paths in Package.swift and the app icon's missing alpha channel.
        # Every one of those is a silent failure on Windows and an expensive one at upload time, so
        # they run BEFORE spending twenty minutes of Mac time on a build that cannot be shipped.
        script: npm test

      - name: Point the native project at this tier
        # A NO-OP THAT STILL VERIFIES for production: it re-derives the committed values from
        # scripts/set-build-tier.mjs's table and refuses a project that is in any other state. So the
        # release workflow PROVES the tree is clean rather than assuming it — which matters precisely
        # because the staging workflow is the one thing that can leave a `.staging` identifier behind.
        script: node scripts/set-build-tier.mjs "$BL_TIER"

      - name: Build the web bundle
        # Fills `dist/`, including `public/` wholesale — which is how the 31 MB of prebaked narration
        # gets into the binary. Also rewrites `src/config/version.ts`; the dirty tree is expected and
        # is never committed from CI.
        #
        # BL_TIER / BL_API_ORIGIN are read here by vite.config.ts's `define`. They are build-time
        # environment variables and nothing else: the shipped binary has no environment to read, which
        # is the whole argument in src/config/apiBase.ts.
        script: npm run build

      - name: Verify the ARTIFACT is a production build
        # Reads dist/, not the source — "local green proves nothing about the deployed artifact". It
        # asserts the staging host is ABSENT (the direction that is exact; see the script's header for
        # why the reverse cannot be), that the harness never shipped, and the prebaked-clip count.
        #
        # That last check REPLACES this workflow's old inline `find dist/sounds/tts | wc -l` step. One
        # implementation, not two that drift — the failure it catches is a binary that installs,
        # launches, renders perfectly and is MUTE, invisible in a screenshot.
        script: node scripts/verify-build-tier.mjs "$BL_TIER"

      - name: Sync the web build into the iOS project
        # Copies dist/ into ios/App/App/public and regenerates Package.swift. Run on macOS it writes
        # POSIX plugin paths, so it also repairs the one thing a Windows `cap sync` gets wrong.
        script: npx cap sync ios

      - name: Set the build number
        # TestFlight refuses a CFBundleVersion it has already seen, and the committed value is 1.
        # MARKETING_VERSION (CFBundleShortVersionString) is deliberately NOT touched: it is the
        # store-facing version, it must match the App Store Connect record, and bumping it silently
        # per build would create a new version rather than a new build. Bump it by hand in the pbxproj
        # when shipping 1.1.
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Create the signing certificate and profile, then apply them
        # `--create` is the whole point. On the FIRST build nothing exists on Apple's side except the
        # registered App ID, so anything that merely FETCHES finds nothing. This creates the
        # distribution certificate and the App Store profile through the API key — which is exactly
        # what removes the "certificates need a Mac" problem (§2.3), and why the owner never has to
        # generate a CSR or touch the Apple portal.
        #
        # The previous version of this step ran `xcode-project use-profiles` ALONE, under the name
        # "Fetch signing certificates and profiles". `use-profiles` neither fetches nor creates: it
        # applies profiles already sitting in ~/Library/MobileDevice/Provisioning Profiles. The step
        # name described an intention the command never carried out, which is how this shipped.
        #
        # `integrations.app_store_connect` above injects APP_STORE_CONNECT_ISSUER_ID,
        # APP_STORE_CONNECT_KEY_IDENTIFIER and APP_STORE_CONNECT_PRIVATE_KEY, so none of these four
        # commands needs credentials passed explicitly.
        # `--certificate-key` is NOT optional and its absence is a second wasted build. A certificate
        # is a public key signed by Apple, so CREATING one requires a private key to put inside it, and
        # the API key cannot supply that — it authenticates, it does not generate keys. Without it the
        # step dies on "Cannot save Signing Certificates without certificate private key" AFTER
        # successfully initialising the keychain, which reads like a keychain problem and is not.
        #
        # CERTIFICATE_PRIVATE_KEY is an RSA 2048 PKCS#1 key (`-----BEGIN RSA PRIVATE KEY-----`),
        # pasted into Codemagic as a SECRET variable, NOT base64-encoded, and never committed
        # (`.gitignore` refuses `*.pem`/`*.key`). Generate a replacement with:
        #   openssl genrsa -traditional -out ios_distribution_private_key.pem 2048
        # Verified 2026-08-07 against the live account with `app-store-connect certificates list
        # --type IOS_DISTRIBUTION` from WINDOWS: zero certificates existed, so there was never
        # anything for the declarative path to find.
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build the IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      # Keep the raw logs: a first-build failure here is the only diagnostic available from Windows.
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        # The owner's PERSONAL address. The work domain is never used in this project.
        recipients:
          - allanvraa@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # TestFlight only. The store submission itself stays a deliberate, manual act by the owner
        # (§4.4 C11) — `submit_to_app_store` is intentionally absent and should stay that way.
        submit_to_testflight: true
